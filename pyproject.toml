[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.11"]

[project]
authors = [{ email = "1983160+ashvardanian@users.noreply.github.com", name = "Ash Vardanian" }]
dependencies = ["numpy"]
description = "Multiversioned and monoversioned builds of SIMD and GPU kernels, and the images that validate them"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "fatwheels"
readme = "README.md"
requires-python = ">=3.12"
urls = { Homepage = "https://github.com/ashvardanian/FatWheels" }

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
build-dir = "build_python/{wheel_tag}"
install.components = ["fatwheels_python"]
sdist.exclude = ["build*"]
wheel.packages = ["python/fatwheels"]

[tool.scikit-build.cmake.define]
FATWHEELS_BUILD_PYTHON = "ON"
FATWHEELS_BUILD_TEST = "OFF"
FATWHEELS_CUDA_ARCH = { default = "", env = "FATWHEELS_CUDA_ARCH" }
FATWHEELS_MARCH = { default = "", env = "FATWHEELS_MARCH" }
FATWHEELS_ROCM_ARCH = { default = "", env = "FATWHEELS_ROCM_ARCH" }

[tool.scikit-build.metadata.version]
input = "VERSION"
provider = "scikit_build_core.metadata.regex"
regex = "(?P<value>.+)"

[tool.ruff]
line-length = 120
target-version = "py312"
