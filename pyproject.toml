[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fatwheels"
dynamic = ["version"]
description = "Starter kit for one Python wheel carrying multi-versioned CPU kernels and both NVIDIA and AMD GPU modules"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com" }]
urls = { Homepage = "https://github.com/ashvardanian/FatWheels" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "pytest-benchmark", "numba"]

[tool.setuptools]
packages = ["fatwheels"]

[tool.setuptools.package-data]
fatwheels = ["__init__.pyi", "py.typed"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["D", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!fatwheels/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["fatwheels"]
combine-as-imports = true
