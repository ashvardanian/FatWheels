name: Images

on:
  push:
    branches: ["main"]
    paths: ["Dockerfile", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ashvardanian/fatwheels

jobs:
  # Each architecture builds natively. A registry cache per target and architecture, with timestamps pinned to the
  # commit, keeps unchanged stages byte-identical, so GHCR stores and receives only the layers a pin changed.
  build:
    name: Build ${{ matrix.target }} Image for ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, verify, gpu]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The ROCm base the amd64 `gpu` stage slices from is 8 GB compressed and about 30 GB unpacked.
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache
          docker image prune --all --force
          df -h /
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cache=$IMAGE:cache-${{ matrix.target }}-${{ matrix.arch }}
          docker buildx build --target ${{ matrix.target }} --provenance=false \
            --cache-from type=registry,ref=$cache --cache-to type=registry,ref=$cache,mode=max \
            --output type=image,name=$IMAGE:${{ matrix.target }}-${GITHUB_SHA::7}-${{ matrix.arch }},push=true,rewrite-timestamp=true .

  publish:
    name: Publish ${{ matrix.target }} Manifest
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [cpu, verify, gpu]
    steps:
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the Architectures
        run: |
          tag=$IMAGE:${{ matrix.target }}-${GITHUB_SHA::7}
          docker buildx imagetools create --tag $tag --tag $IMAGE:${{ matrix.target }} $tag-amd64 $tag-arm64
          docker buildx imagetools inspect $tag --format '{{json .Manifest.Digest}}' >>"$GITHUB_STEP_SUMMARY"
