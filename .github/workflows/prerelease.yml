name: Pre-Release

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    branches: ["main*"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]

permissions:
  contents: read

# One group per source branch: `push` covers `main` and a request covers every `main*` branch, so a
# branch with an open request is built once. Superseded request runs cancel; `main` runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_native:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build and Test
        run: |
          pip install .[test]
          pytest test/matmul.py -x

  # The `Images` workflow publishes the images; pin them by digest.
  check_cpu:
    name: Check CPU Capabilities under SDE and QEMU
    runs-on: ubuntu-26.04
    container: ghcr.io/ashvardanian/fatwheels:cpu@sha256:644a4ce0011feb651a2011d6e2a08400fa4ea8015787e33e62e1a88dc1cd1009
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: python3 -m pytest test/conventions.py test/placement.py -m cpu

  # Each emulated CPU is its own row: QEMU for SVE and SME, Intel SDE for the AVX-512 and AMX that QEMU lacks.
  test_emulated:
    name: Test ${{ matrix.preset }} under ${{ matrix.emulator }}
    runs-on: ubuntu-26.04
    container: ghcr.io/ashvardanian/fatwheels:cpu@sha256:644a4ce0011feb651a2011d6e2a08400fa4ea8015787e33e62e1a88dc1cd1009
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: aarch64-qemu, emulator: "qemu-aarch64 -cpu max,sve=off,sme=off" }
          - { preset: aarch64-qemu, emulator: "qemu-aarch64 -cpu max,sme=off,sve-max-vq=1" }
          - { preset: aarch64-qemu, emulator: "qemu-aarch64 -cpu max,sme=off,sve-max-vq=4" }
          - { preset: aarch64-qemu, emulator: "qemu-aarch64 -cpu max,sve-max-vq=4,sme-default-vector-length=64" }
          - { preset: clang-floor, emulator: "sde64 -skx --" }
          - { preset: clang-floor, emulator: "sde64 -spr --" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ${{ matrix.emulator }} build_${{ matrix.preset }}/fatwheels_test

  # No hosted runner has a GPU, so this checks compiles, kernel entries and the instructions each generation emits:
  # both vendors on x86-64, and NVIDIA's alone on Arm, as Grace Hopper builds it.
  check_gpu:
    name: Check GPU Generations on ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: ghcr.io/ashvardanian/fatwheels:gpu@sha256:1ae7b480bfe25fc0d337137ac4aa2f550554bf697160a788616136c8a6728df2
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: python3 -m pytest test/conventions.py -m "cuda or rocm"
