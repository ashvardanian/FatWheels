name: Pre-Release

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    branches: ["main*"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]

permissions:
  contents: read

# One group per source branch: `push` covers `main` and a request covers every `main*` branch, so a
# branch with an open request is built once. Superseded request runs cancel; `main` runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_native:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build and Test
        run: |
          pip install .[test]
          pytest test/matmul.py -x

  # The images are built on local machines and pushed, as the README's publishing steps show; pin them by digest.
  check_cpu:
    name: Check CPU Capabilities under SDE and QEMU
    runs-on: ubuntu-26.04
    container: ghcr.io/ashvardanian/fatwheels:cpu@sha256:1efa571e59262693914e577d3d68530fc102ea4a45f26a8740d73ddb5b32aef7
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: python3 test/conventions.py cpu

  # No hosted runner has a GPU, so this checks compiles, kernel entries and the instructions each generation emits:
  # both vendors on x86-64, and NVIDIA's alone on Arm, as Grace Hopper builds it.
  check_gpu:
    name: Check GPU Generations on ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    container: ghcr.io/ashvardanian/fatwheels:gpu@sha256:4003c633da0c7f69688c17130fcc56e4f7dcc804a24062bceee30a2c0a92511a
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: python3 test/conventions.py gpu
